# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: workforce-scheduler
    runtime: docker
    plan: starter
    region: ohio   # closest Render region to southern Illinois; cannot be changed after creation
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false   # Render prompts for this on first deploy
      # Optional: enables the "Sync from Procore" button on Verify Hours so time
      # cards can be pulled from the Procore API instead of uploading a CSV.
      # Set these in the Render dashboard (Environment tab) -- see procore-sync/README.md.
      - key: PROCORE_CLIENT_ID
        sync: false
      - key: PROCORE_CLIENT_SECRET
        sync: false
      - key: PROCORE_COMPANY_ID
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
